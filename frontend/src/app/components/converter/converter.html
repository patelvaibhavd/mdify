<div class="converter-card glass animate-fade-in">
    <div class="card-header">
        <h3>Input Text</h3>
        <div class="actions">
            <select [(ngModel)]="selectedProvider" class="provider-select">
                <option value="mock">Mock Engine (Free)</option>
                <option value="gemini">Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="grok">Grok</option>
            </select>
            <label class="icon-btn" title="Upload File">
                <lucide-icon [name]="Upload"></lucide-icon>
                <input type="file" (change)="onFileUpload($event)" accept=".txt" style="display: none;">
            </label>
            <button class="icon-btn delete" (click)="clear()" title="Clear">
                <lucide-icon [name]="Trash2"></lucide-icon>
            </button>
        </div>
    </div>

    <textarea [(ngModel)]="inputText" placeholder="Paste your text here or upload a .txt file..."
        class="text-area"></textarea>

    <div class="card-footer">
        <button class="convert-btn primary" [disabled]="isConverting() || !inputText" (click)="onConvert()">
            <lucide-icon [name]="isConverting() ? Loader2 : Wand2" [class.spin]="isConverting()"></lucide-icon>
            {{ isConverting() ? 'Converting...' : 'Convert to Markdown' }}
        </button>
    </div>
</div>
