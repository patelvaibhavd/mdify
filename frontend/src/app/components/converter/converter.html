<div class="converter-card glass">
    <div class="card-header">
        <div class="header-main">
            <lucide-icon [name]="Wand2" class="header-icon"></lucide-icon>
            <div class="header-text">
                <h3>Transform</h3>
                <p>Convert raw text to beautiful markdown</p>
            </div>
        </div>
        <div class="header-actions">
            <select [(ngModel)]="selectedProvider" class="provider-select">
                <option value="mock">Mock Engine (Free)</option>
                <option value="gemini" disabled>Gemini Flash</option>
                <option value="openai" disabled>OpenAI GPT-4o</option>
                <option value="groq">Groq Llama 3</option>
            </select>
        </div>
    </div>

    <div class="input-area">
        <textarea [(ngModel)]="inputText" placeholder="Paste your unformatted text here..."
            [disabled]="isConverting()"></textarea>

        <div class="input-overlay" *ngIf="!inputText && !isConverting()">
            <lucide-icon [name]="Wand2" class="upload-hint-icon"></lucide-icon>
            <p>Paste your text to start</p>
        </div>
    </div>

    <div class="card-footer">
        <button class="btn-clear" (click)="clear()" [disabled]="isConverting() || !inputText" title="Clear All">
            <lucide-icon [name]="Trash2"></lucide-icon>
        </button>

        <button class="btn-primary" (click)="onConvert()" [disabled]="isConverting() || !inputText.trim()">
            <lucide-icon [name]="isConverting() ? Loader2 : Wand2" [class.animate-spin]="isConverting()"></lucide-icon>
            <span>{{ isConverting() ? 'Converting...' : 'Convert' }}</span>
        </button>
    </div>
</div>
