<header class="header glass sticky-header">
    <div class="logo" routerLink="/" style="cursor: pointer;">
        <div class="logo-icon">
            <lucide-icon [name]="FileText"></lucide-icon>
        </div>
        <h1>Mdify</h1>
    </div>

    <div class="actions">
        <button class="btn-icon" routerLink="/guide" routerLinkActive="active" title="Markdown Guide">
            <lucide-icon [name]="HelpCircle"></lucide-icon>
        </button>

        <a href="https://github.com" target="_blank" class="btn-icon" title="GitHub">
            <lucide-icon [name]="Github"></lucide-icon>
        </a>

        <button class="btn-icon" (click)="themeService.toggleTheme()"
            [title]="themeService.theme() === 'light' ? 'Dark Mode' : 'Light Mode'">
            <lucide-icon [name]="themeService.theme() === 'light' ? Moon : Sun"></lucide-icon>
        </button>

        <button class="btn-icon" (click)="toggleSettings()" title="Settings">
            <lucide-icon [name]="Settings"></lucide-icon>
        </button>
    </div>

    <app-settings *ngIf="showSettings" (close)="toggleSettings()"></app-settings>
</header>
