<div class="help-container">
    <div class="help-header">
        <div class="title">
            <lucide-icon [name]="BookOpen"></lucide-icon>
            <h2>Markdown Guide</h2>
        </div>
        <button class="btn-icon small" (click)="close.emit()" title="Hide Guide">
            <lucide-icon [name]="X"></lucide-icon>
        </button>
    </div>

    <div class="help-content">
        <div class="rule-group" *ngFor="let rule of rules">
            <h3>{{ rule.name }}</h3>
            <div class="rule-detail">
                <code class="syntax">{{ rule.syntax }}</code>
                <p class="example" [innerHTML]="rule.example"></p>
            </div>
        </div>
    </div>
</div>
