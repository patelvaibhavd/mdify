<div class="preview-card glass">
    <div class="card-header">
        <div class="header-main">
            <lucide-icon [name]="Eye" class="header-icon"></lucide-icon>
            <div class="header-text">
                <h3>Visual Preview</h3>
                <p>Real-time markdown rendering</p>
            </div>
        </div>
        <div class="header-actions" *ngIf="content">
            <button class="btn-icon" (click)="onCopy()" [title]="copyText">
                <lucide-icon [name]="CheckCircle" *ngIf="showCopySuccess" class="success-icon"></lucide-icon>
                <lucide-icon [name]="Copy" *ngIf="!showCopySuccess"></lucide-icon>
            </button>
            <button class="btn-icon" (click)="onDownload()" title="Download .md">
                <lucide-icon [name]="Download"></lucide-icon>
            </button>
        </div>
    </div>

    <div class="preview-content scroll-area">
        <div *ngIf="!content" class="empty-state">
            <div class="empty-icon-wrapper">
                <lucide-icon [name]="FileCode"></lucide-icon>
            </div>
            <h4>No Content Yet</h4>
            <p>Convert some text to see the preview here</p>
        </div>

        <div *ngIf="content" class="markdown-preview markdown-body">
            <markdown [data]="content"></markdown>
        </div>
    </div>
</div>
