<div class="settings-card glass">
    <h5>Appearance</h5>
    <div class="theme-options">
        <button [class.active]="themeService.theme() === 'light'" (click)="themeService.toggleTheme()">
            <lucide-icon [name]="Sun"></lucide-icon>
            Light
        </button>
        <button [class.active]="themeService.theme() === 'dark'" (click)="themeService.toggleTheme()">
            <lucide-icon [name]="Moon"></lucide-icon>
            Dark
        </button>
    </div>
</div>
