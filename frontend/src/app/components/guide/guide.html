<div class="guide-page">
    <div class="main-container">
        <div class="guide-header">
            <div class="title-section">
                <div class="icon-orb">
                    <lucide-icon [name]="BookOpen" class="guide-icon"></lucide-icon>
                </div>
                <div>
                    <h1>Markdown Mastering Guide</h1>
                    <p>Learn how to format your text like a pro</p>
                </div>
            </div>
            <button class="btn-primary" routerLink="/">
                <lucide-icon [name]="Wand2" style="width: 18px; height: 18px;"></lucide-icon>
                <span>Back to App</span>
            </button>
        </div>

        <div class="guide-grid">
            <div class="rule-card" *ngFor="let rule of rules">
                <div class="rule-header">
                    <h3>{{ rule.name }}</h3>
                    <div class="dash"></div>
                </div>
                <div class="rule-body">
                    <div class="syntax-section">
                        <label>Syntax</label>
                        <code class="syntax-code">{{ rule.syntax }}</code>
                    </div>
                    <div class="preview-section">
                        <label>Result In App</label>
                        <div class="preview-box markdown-body" [innerHTML]="rule.safeExample"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="guide-footer glass">
            <p>Pro Tip: Use the <strong>Groq</strong> engine for the fastest and most accurate conversions.</p>
        </div>
    </div>
</div>
